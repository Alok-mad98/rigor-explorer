<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <pattern id="noise" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#006666"/>
      <rect width="64" height="64" fill="#057a7a" opacity="0.25"/>
    </pattern>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1068c8"/>
      <stop offset="1" stop-color="#000060"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#noise)"/>
  <rect width="1200" height="400" fill="#006666" opacity="0.55"/>

  <!-- beveled window -->
  <g transform="translate(80,60)">
    <rect width="560" height="300" fill="#c0c0c0" stroke="#ffffff" stroke-width="2"/>
    <rect x="2" y="2" width="556" height="296" fill="none" stroke="#000000" stroke-width="2"/>
    <rect x="4" y="4" width="552" height="24" fill="url(#titlebar)"/>
    <text x="12" y="21" font-family="Courier New, monospace" font-size="13" fill="#ffffff" font-weight="bold">RIGOR EXPLORER 98 — C:\RIGOR\EXPLORER</text>
    <rect x="508" y="8" width="16" height="16" fill="#c0c0c0" stroke="#ffffff"/>
    <rect x="510" y="10" width="12" height="12" fill="#c0c0c0" stroke="#000000"/>

    <!-- inner screen: dark terminal with block chain -->
    <rect x="16" y="34" width="528" height="222" fill="#05140c" stroke="#808080"/>
    <!-- chain of cubes -->
    <g stroke="#33ff99" fill="none" stroke-width="2">
      <rect x="36"  y="120" width="44" height="44"/>
      <rect x="106" y="104" width="44" height="44"/>
      <rect x="176" y="122" width="44" height="44"/>
      <rect x="246" y="106" width="44" height="44"/>
      <rect x="316" y="98"  width="44" height="44" stroke="#7dffcc" stroke-width="3"/>
    </g>
    <g stroke="#1c5f45" stroke-width="2">
      <line x1="80" y1="142" x2="106" y2="126"/>
      <line x1="150" y1="126" x2="176" y2="144"/>
      <line x1="220" y1="144" x2="246" y2="128"/>
      <line x1="290" y1="128" x2="316" y2="120"/>
    </g>
    <text x="326" y="92" font-family="Courier New, monospace" font-size="11" fill="#33ff99">tip</text>
    <text x="36" y="70" font-family="Courier New, monospace" font-size="12" fill="#9fe8c6">&gt; tip #1191 · peers 101 · mempool 6</text>
    <text x="36" y="196" font-family="Courier New, monospace" font-size="12" fill="#4e7a66">&gt; blocks · txs · utxos · convergence</text>
    <text x="36" y="216" font-family="Courier New, monospace" font-size="12" fill="#33ff99">_</text>
    <!-- 3D floor grid -->
    <g stroke="#0a3324" stroke-width="1">
      <line x1="16" y1="256" x2="544" y2="256"/>
      <line x1="16" y1="240" x2="544" y2="240"/>
      <line x1="16" y1="224" x2="544" y2="224"/>
    </g>

    <!-- toolbar strip -->
    <rect x="16" y="264" width="528" height="18" fill="#c0c0c0" stroke="#808080"/>
    <rect x="20" y="268" width="120" height="11" fill="#ffffff" stroke="#808080"/>
    <text x="24" y="277" font-family="Courier New, monospace" font-size="9" fill="#000000">rg1q…  Find  Run</text>

    <!-- statusbar -->
    <rect x="4" y="282" width="552" height="14" fill="#c0c0c0"/>
    <rect x="10" y="284" width="200" height="10" fill="#dfdfdf" stroke="#808080"/>
    <rect x="430" y="284" width="120" height="10" fill="#dfdfdf" stroke="#808080"/>
    <circle cx="16" cy="289" r="3" fill="#008000"/>
  </g>

  <!-- desktop icons right side -->
  <g transform="translate(740,90)">
    <g>
      <rect x="0" y="0" width="30" height="24" fill="#c0c0c0" stroke="#000000"/>
      <rect x="4" y="4" width="22" height="14" fill="#006666"/>
      <rect x="8" y="28" width="18" height="8" fill="#808080" stroke="#000000"/>
      <text x="2" y="50" font-family="Courier New, monospace" font-size="12" fill="#ffffff" text-anchor="middle">My Computer</text>
    </g>
    <g transform="translate(0,86)">
      <rect x="0" y="0" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="2"/>
      <line x1="11" y1="11" x2="24" y2="24" stroke="#ffffff" stroke-width="3"/>
      <text x="-4" y="50" font-family="Courier New, monospace" font-size="12" fill="#ffffff">Find</text>
    </g>
    <g transform="translate(0,172)">
      <polygon points="12,0 24,7 24,18 12,25 0,18 0,7" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="-8" y="50" font-family="Courier New, monospace" font-size="12" fill="#ffffff">Chain 3D</text>
    </g>
  </g>

  <!-- title -->
  <g transform="translate(880,120)">
    <text x="0" y="60" font-family="Courier New, monospace" font-size="52" fill="#ffffff" font-weight="bold">RIGOR</text>
    <text x="0" y="105" font-family="Courier New, monospace" font-size="52" fill="#33ff99" font-weight="bold">EXPLORER</text>
    <rect x="2" y="120" width="290" height="3" fill="#33ff99"/>
    <text x="0" y="150" font-family="Courier New, monospace" font-size="15" fill="#cfeee2">Every block. Every transaction.</text>
    <text x="0" y="172" font-family="Courier New, monospace" font-size="15" fill="#cfeee2">In the open.</text>
  </g>

  <!-- taskbar -->
  <rect x="0" y="368" width="1200" height="32" fill="#c0c0c0"/>
  <rect x="0" y="366" width="1200" height="2" fill="#ffffff"/>
  <g transform="translate(8,374)">
    <rect width="84" height="20" fill="#c0c0c0" stroke="#ffffff"/>
    <rect x="2" y="2" width="80" height="16" fill="#c0c0c0" stroke="#000000"/>
    <circle cx="12" cy="10" r="6" fill="#006666" stroke="#000000"/>
    <text x="22" y="14" font-family="Courier New, monospace" font-size="11" font-weight="bold" fill="#000000">Start</text>
  </g>
  <g transform="translate(104,374)">
    <rect width="200" height="20" fill="#c0c0c0" stroke="#ffffff"/>
    <rect x="2" y="2" width="196" height="16" fill="#c0c0c0" stroke="#000000"/>
    <text x="10" y="14" font-family="Courier New, monospace" font-size="11" fill="#000000">RIGOR MAINNET</text>
  </g>
  <g transform="translate(1060,374)">
    <rect width="130" height="20" fill="#c0c0c0" stroke="#808080"/>
    <circle cx="12" cy="10" r="4" fill="#008000"/>
    <text x="22" y="14" font-family="Courier New, monospace" font-size="11" fill="#000000">10:26 PM</text>
  </g>
</svg>
